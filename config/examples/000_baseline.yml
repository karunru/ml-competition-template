seed_everything: &seed 1031

root: others

dataset:
  dir: data
  feature_dir: features
  params:

features:
  - Target
  - Basic

categorical_cols: []

target: is_kokuhou

target_encoding: False

pre_process:
  do: False
  col: Area
  xentropy: False

post_process:
  do: False
  col: Area

stacking:
  do: False
  use_org_cols: True
  predictions: []

model:
  name: xgb
  mode: classification

  model_params:
    objective: binary:logistic
    booster: gbtree
    eval_metric: auc
    tree_method: gpu_hist
    max_depth: 4
    max_leaves: 128
    learning_rate: 0.0001
    n_estimators: 10000
    min_child_weight: 110
    gamma: 0.1
    colsample_bytree: 0.7
    colsample_bylevel: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    verbosity: 0
    seed: *seed
    random_state: *seed

  train_params:
    num_boost_round: 10000
    early_stopping_rounds: 1000

val:
  name: stratified_kfold
  params:
    n_splits: 5
    id: index
    target: is_kokuhou
    random_state: *seed
    force_recreate: False

train_folds:
  - 0
  - 1
  - 2
  - 3
  - 4

output_dir: output
